name: DisplayPlus
options:
  bundleIdPrefix: com.displayplus
  deploymentTarget:
    macOS: "14.0"

targets:
  DisplayPlus:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: DisplayPlus
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.displayplus.app
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSHumanReadableCopyright: "Display+ - Free & Open Source"
        INFOPLIST_KEY_CFBundleDisplayName: "Display+"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: DisplayPlus/DisplayPlus.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: "-"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_OBJC_BRIDGING_HEADER: DisplayPlus/DisplayPlus-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: "Display+ needs Screen Recording permission to show a live preview of each display."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
